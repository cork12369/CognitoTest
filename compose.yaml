services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: looply-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: looply
      POSTGRES_USER: looply
      POSTGRES_PASSWORD: looply_local_dev
    ports:
      - "5432:5432"
    volumes:
      - looply_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U looply -d looply"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  looply_postgres_data: